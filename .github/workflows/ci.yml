name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
        # Ruling R3: the real-keychain round-trip test (EMOS_TEST_KEYCHAIN=1) runs on macOS only.
        # Windows CI verifies packaging and service startup; Credential Manager remains an owner
        # desktop check because the hosted runner cannot provide a representative user session.
        include:
          - os: macos-14
            test-keychain: "1"
          - os: windows-latest
            test-keychain: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
        env:
          EMOS_TEST_KEYCHAIN: ${{ matrix.test-keychain }}

  smoke:
    # Packages this OS's VSIX (bundled Node runtime + keyring addon), installs it into a clean
    # VS Code profile and runs the extension smoke test (test/smoke/). Not part of `npm run ci`:
    # it downloads VS Code and the Node runtime.
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/node-runtime
          key: node-runtime-${{ runner.os }}-${{ hashFiles('packages/extension/node-runtime.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - name: Upload VSIX
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: packages/extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits via the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
